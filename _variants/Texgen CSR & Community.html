  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n:root {\n  --color-bg: #f3f2f2;\n  --color-surface: #eae9e9;\n  --color-text: #201e1d;\n  --color-accent: #ec3013;\n  --color-accent-2: #e15b47;\n  --color-divider: color-mix(in srgb, #201e1d 40%, transparent);\n\n  /* Tonal ramps — generated in OKLCH on one shared lightness scale, so the\n     same step of any role matches the others in visual value. */\n  --color-neutral-100: #f8f4f4;\n  --color-neutral-200: #eae7e7;\n  --color-neutral-300: #d7d3d3;\n  --color-neutral-400: #bab6b6;\n  --color-neutral-500: #9b9797;\n  --color-neutral-600: #7d7979;\n  --color-neutral-700: #605d5d;\n  --color-neutral-800: #444141;\n  --color-neutral-900: #2d2b2b;\n\n  --color-accent-100: #fff2ef;\n  --color-accent-200: #ffe0d9;\n  --color-accent-300: #ffc4b8;\n  --color-accent-400: #ff9783;\n  --color-accent-500: #ff563c;\n  --color-accent-600: #dd2b0f;\n  --color-accent-700: #ae1800;\n  --color-accent-800: #7c1405;\n  --color-accent-900: #4d170e;\n\n  --color-accent-2-100: #fff2ef;\n  --color-accent-2-200: #ffe0da;\n  --color-accent-2-300: #ffc4b9;\n  --color-accent-2-400: #ff9784;\n  --color-accent-2-500: #ef6853;\n  --color-accent-2-600: #c94b39;\n  --color-accent-2-700: #9e3526;\n  --color-accent-2-800: #71261b;\n  --color-accent-2-900: #471d16;\n\n  --font-heading: \"Archivo\", system-ui, sans-serif;\n  --font-heading-weight: 800;\n  --font-body: \"Archivo\", system-ui, sans-serif;\n\n  --space-1: 4.0px;\n  --space-2: 8.0px;\n  --space-3: 12.0px;\n  --space-4: 16.0px;\n  --space-6: 24.0px;\n  --space-8: 32.0px;\n\n  --radius-sm: 0px;\n  --radius-md: 0px;\n  --radius-lg: 0px;\n\n  /* Elevation — derived from the ground: soft ink-tinted shadows on a\n     light theme, a hairline edge + ambient darkness on a dark one. */\n  --shadow-sm: 0 1px 2px color-mix(in srgb, #2d2b2b 14%, transparent);\n  --shadow-md: 0 3px 10px color-mix(in srgb, #2d2b2b 16%, transparent);\n  --shadow-lg: 0 12px 32px color-mix(in srgb, #2d2b2b 22%, transparent);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.grayscale{filter:grayscale(1) contrast(1.08)}\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 2px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); justify-content: flex-start; text-align: left; }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: 2px solid var(--color-divider);\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 2px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid var(--color-divider);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg);\n  background: var(--color-surface); box-shadow: var(--shadow-lg);\n}\n.dialog-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 20px;\n}\n.dialog-body { font-size: 14px; opacity: 0.85; }\n.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }\n\n<\u002Fstyle>\n<script src=\"ea7e37bf-19f7-47ea-ae41-5adc5c5e1415\"><\u002Fscript>\n<style>\n  html { scroll-behavior: smooth; -webkit-font-smoothing: antialiased; }\n  body { margin: 0; background: var(--color-bg); color: var(--color-text); font-family: \"Archivo\", system-ui, sans-serif; }\n  @supports not (animation-timeline: view()) { [style*=\"animation-timeline\"] { animation: none !important; opacity: 1 !important; transform: none !important; } }\n  a { color: var(--color-accent-700); text-decoration: none; }\n  a:hover { color: var(--color-accent); }\n  ::selection { background: var(--color-accent); color: #fff; }\n  @keyframes cUp { from { opacity: 0; transform: translateY(34px); } to { opacity: 1; transform: none; } }\n  @keyframes cCell { from { opacity: 0; transform: translateY(22px) scale(.98); } to { opacity: 1; transform: none; } }\n  @keyframes cClip { from { clip-path: inset(0 0 100% 0); } to { clip-path: inset(0 0 0 0); } }\n  @keyframes cFade { from { opacity: 0; } to { opacity: 1; } }\n  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"min-height:100vh\">\n\n<header style=\"position:sticky;top:0;z-index:60;background:var(--color-bg);border-bottom:1px solid var(--color-divider)\">\n  <div style=\"max-width:1600px;margin:0 auto;padding:0 clamp(12px,2vw,28px);display:flex;align-items:stretch;min-height:62px;overflow-x:auto;scrollbar-width:none\">\n    <a href=\"Texgen-Home.dc.html\" style=\"display:flex;align-items:center;padding:14px clamp(14px,2vw,24px) 14px 0;border-right:1px solid var(--color-divider);flex:none\"><img src=\"3836d5e8-12d9-4d45-b0e7-0626caff1250\" alt=\"Texgen Group\" style=\"height:30px;filter:brightness(0)\"><\u002Fa>\n    <a href=\"Texgen-About.dc.html\" style=\"display:flex;align-items:center;padding:16px clamp(12px,1.6vw,22px);border-right:1px solid var(--color-divider);font-size:12px;flex:none;white-space:nowrap;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--color-text)\" style-hover=\"background: var(--color-accent-100)\">About<\u002Fa>\n    <a href=\"Texgen-Capabilities.dc.html\" style=\"display:flex;align-items:center;padding:16px clamp(12px,1.6vw,22px);border-right:1px solid var(--color-divider);font-size:12px;flex:none;white-space:nowrap;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--color-text)\" style-hover=\"background: var(--color-accent-100)\">Capabilities<\u002Fa>\n    <a href=\"Texgen-Products.dc.html\" style=\"display:flex;align-items:center;padding:16px clamp(12px,1.6vw,22px);border-right:1px solid var(--color-divider);font-size:12px;flex:none;white-space:nowrap;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--color-text)\" style-hover=\"background: var(--color-accent-100)\">Products<\u002Fa>\n    <a href=\"Texgen-Sustainability.dc.html\" style=\"display:flex;align-items:center;padding:16px clamp(12px,1.6vw,22px);border-right:1px solid var(--color-divider);font-size:12px;flex:none;white-space:nowrap;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--color-text)\" style-hover=\"background: var(--color-accent-100)\">Compliance<\u002Fa>\n    <a href=\"Texgen-CSR.dc.html\" style=\"display:flex;align-items:center;padding:16px clamp(12px,1.6vw,22px);border-right:1px solid var(--color-divider);font-size:12px;flex:none;white-space:nowrap;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--color-accent)\">CSR<\u002Fa>\n    <a href=\"Texgen-Contact.dc.html\" style=\"display:flex;align-items:center;justify-content:center;gap:8px;padding:16px clamp(14px,1.8vw,24px);background:var(--color-accent);flex:none;margin-left:auto;white-space:nowrap;color:#fff;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase\" style-hover=\"background: var(--color-accent-600)\">Request a quote <span>→<\u002Fspan><\u002Fa>\n  <\u002Fdiv>\n<\u002Fheader>\n\n<div style=\"{{ listStyle }}\">\n\n<section style=\"border-bottom:2px solid var(--color-text)\">\n  <div style=\"max-width:1600px;margin:0 auto;padding:clamp(32px,5vw,80px) clamp(12px,2vw,28px) clamp(24px,3vw,40px)\">\n    <div style=\"font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--color-neutral-600);margin-bottom:20px\"><a href=\"Texgen-Home.dc.html\" style=\"color:var(--color-neutral-600)\">Home<\u002Fa> · CSR &amp; Community<\u002Fdiv>\n    <div style=\"display:flex;justify-content:space-between;align-items:flex-end;gap:28px;flex-wrap:wrap\">\n      <h1 style=\"font-size:clamp(34px,5.4vw,84px);line-height:.94;font-weight:900;letter-spacing:-.04em;margin:0;max-width:14ch\"><span style=\"display:block;animation:cClip .9s cubic-bezier(.2,.8,.2,1) both\">Notes from the floor<\u002Fspan><\u002Fh1>\n      <p style=\"max-width:40ch;font-size:15px;line-height:1.6;color:var(--color-neutral-700);margin:0;animation:cUp .8s .15s cubic-bezier(.2,.8,.2,1) both\">What we are actually doing about energy, materials, and the people who work here — written up as we go, with the numbers attached.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"border-bottom:1px solid var(--color-divider)\">\n  <div style=\"max-width:1600px;margin:0 auto;padding:0 clamp(12px,2vw,28px)\">\n    <a href=\"{{ featuredHref }}\" sc-camel-on-click=\"{{ openFeatured }}\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:0;border-left:1px solid var(--color-divider);border-right:1px solid var(--color-divider);color:var(--color-text)\" style-hover=\"background: var(--color-accent-100)\">\n      <div style=\"overflow:hidden;aspect-ratio:16/11;background:var(--color-neutral-200);animation:cClip 1s cubic-bezier(.2,.8,.2,1) both\"><img src=\"b835f103-0c02-4c26-8a65-fafb330f2290\" alt=\"Rooftop solar array at the Ashulia facility\" style=\"width:100%;height:100%;object-fit:cover;display:block\"><\u002Fdiv>\n      <div style=\"padding:clamp(24px,4vw,64px);display:flex;flex-direction:column;justify-content:center;gap:18px;animation:cUp .9s .1s cubic-bezier(.2,.8,.2,1) both\">\n        <div style=\"display:flex;align-items:center;gap:12px;font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase\"><span style=\"background:var(--color-accent);color:#fff;padding:5px 9px\">Featured<\u002Fspan><span style=\"color:var(--color-neutral-600)\">Environment · 14 May 2026<\u002Fspan><\u002Fdiv>\n        <h2 style=\"font-size:clamp(26px,3.4vw,50px);line-height:1.02;font-weight:900;letter-spacing:-.035em;margin:0;max-width:18ch\">The roof at Ashulia is now doing a day's work<\u002Fh2>\n        <p style=\"font-size:16px;line-height:1.65;color:var(--color-neutral-700);margin:0;max-width:52ch\">Our solar project is a key step toward an energy-efficient workplace. Here is what is installed, what share of the daily load it covers, and where the next array goes.<\u002Fp>\n        <div style=\"display:flex;align-items:center;gap:10px;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--color-accent)\">Read the note <span>→<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fa>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"position:sticky;top:62px;z-index:50;background:var(--color-bg);border-bottom:1px solid var(--color-divider)\">\n  <div style=\"max-width:1600px;margin:0 auto;padding:0 clamp(12px,2vw,28px);display:flex;flex-wrap:wrap\">\n    <button type=\"button\" sc-camel-on-click=\"{{ fAll }}\" style=\"{{ tAll }}\">All <span style=\"opacity:.55\">{{ nAll }}<\u002Fspan><\u002Fbutton>\n    <button type=\"button\" sc-camel-on-click=\"{{ fEnv }}\" style=\"{{ tEnv }}\">Environment <span style=\"opacity:.55\">{{ nEnv }}<\u002Fspan><\u002Fbutton>\n    <button type=\"button\" sc-camel-on-click=\"{{ fPeople }}\" style=\"{{ tPeople }}\">People <span style=\"opacity:.55\">{{ nPeople }}<\u002Fspan><\u002Fbutton>\n    <button type=\"button\" sc-camel-on-click=\"{{ fCommunity }}\" style=\"{{ tCommunity }}\">Community <span style=\"opacity:.55\">{{ nCommunity }}<\u002Fspan><\u002Fbutton>\n    <button type=\"button\" sc-camel-on-click=\"{{ fGov }}\" style=\"{{ tGov }}\">Governance <span style=\"opacity:.55\">{{ nGov }}<\u002Fspan><\u002Fbutton>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"border-bottom:1px solid var(--color-divider)\">\n  <div style=\"max-width:1600px;margin:0 auto;padding:0 clamp(12px,2vw,28px)\">\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:1px;background:var(--color-divider);border-left:1px solid var(--color-divider);border-right:1px solid var(--color-divider)\">\n      <sc-for list=\"{{ posts }}\" as=\"post\" hint-placeholder-count=\"6\">\n        <a href=\"{{ post.href }}\" sc-camel-on-click=\"{{ post.open }}\" style=\"background:var(--color-bg);display:flex;flex-direction:column;color:var(--color-text);animation:cCell .7s cubic-bezier(.2,.8,.2,1) both;animation-timeline:view();animation-range:entry 0% cover 26%\" style-hover=\"background: var(--color-accent-100)\">\n          <div style=\"aspect-ratio:4/3;overflow:hidden;background:var(--color-neutral-200)\"><img src=\"{{ post.img }}\" alt=\"{{ post.alt }}\" style=\"width:100%;height:100%;object-fit:cover;display:block\"><\u002Fdiv>\n          <div style=\"padding:clamp(18px,2vw,30px);display:flex;flex-direction:column;gap:12px;flex:1\">\n            <div style=\"display:flex;justify-content:space-between;gap:12px;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase\"><span style=\"color:var(--color-accent)\">{{ post.cat }}<\u002Fspan><span style=\"color:var(--color-neutral-600)\">{{ post.date }}<\u002Fspan><\u002Fdiv>\n            <h3 style=\"font-size:clamp(19px,1.6vw,25px);line-height:1.14;font-weight:800;letter-spacing:-.02em;margin:0\">{{ post.title }}<\u002Fh3>\n            <p style=\"font-size:14px;line-height:1.6;color:var(--color-neutral-700);margin:0\">{{ post.excerpt }}<\u002Fp>\n            <div style=\"margin-top:auto;padding-top:14px;display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--color-divider);font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase\"><span style=\"color:var(--color-neutral-600)\">{{ post.read }}<\u002Fspan><span style=\"color:var(--color-accent)\">Read →<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fa>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"background:var(--color-text);color:var(--color-bg);border-bottom:2px solid var(--color-text)\">\n  <div style=\"max-width:1600px;margin:0 auto;padding:clamp(36px,5vw,84px) clamp(12px,2vw,28px);display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:clamp(24px,3vw,52px);align-items:end\">\n    <div>\n      <div style=\"font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--color-accent);margin-bottom:16px\">The short version<\u002Fdiv>\n      <h2 style=\"font-size:clamp(24px,3.2vw,46px);line-height:1.04;font-weight:900;letter-spacing:-.035em;margin:0;max-width:20ch\">Everything here is auditable.<\u002Fh2>\n    <\u002Fdiv>\n    <p style=\"font-size:15px;line-height:1.7;opacity:.72;margin:0;max-width:46ch\">These notes are not a campaign. Each one names a facility, a number, and a standard we are measured against — Higg FEM and FSLM, SEDEX, amfori BSCI, WRAP. If a claim on this page matters to your sourcing decision, ask for the report behind it.<\u002Fp>\n    <div style=\"display:flex;gap:12px;flex-wrap:wrap\"><a href=\"Texgen-Sustainability.dc.html\" class=\"btn btn-primary\">Compliance &amp; certifications<\u002Fa><a href=\"Texgen-Contact.dc.html\" class=\"btn\" style=\"background:transparent;color:var(--color-bg);box-shadow:inset 0 0 0 1px rgba(243,242,242,.4)\">Request a report<\u002Fa><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<\u002Fdiv>\n\n<div style=\"{{ articleStyle }}\">\n\n<article>\n  <section style=\"border-bottom:2px solid var(--color-text)\">\n    <div style=\"max-width:1600px;margin:0 auto;padding:clamp(24px,3vw,44px) clamp(12px,2vw,28px) clamp(24px,3vw,44px)\">\n      <button type=\"button\" sc-camel-on-click=\"{{ back }}\" style=\"appearance:none;background:transparent;border:0;padding:0;margin-bottom:26px;cursor:pointer;font-family:inherit;font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--color-accent)\">← All notes<\u002Fbutton>\n      <div style=\"display:flex;align-items:center;gap:12px;font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;margin-bottom:20px\"><span style=\"background:var(--color-accent);color:#fff;padding:5px 9px\">{{ aCat }}<\u002Fspan><span style=\"color:var(--color-neutral-600)\">{{ aDate }} · {{ aRead }}<\u002Fspan><\u002Fdiv>\n      <h1 style=\"font-size:clamp(30px,4.6vw,72px);line-height:.98;font-weight:900;letter-spacing:-.04em;margin:0;max-width:20ch\">{{ aTitle }}<\u002Fh1>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"border-bottom:1px solid var(--color-divider)\">\n    <div style=\"max-width:1600px;margin:0 auto;padding:0 clamp(12px,2vw,28px)\">\n      <div style=\"aspect-ratio:21/9;overflow:hidden;background:var(--color-neutral-200);border-left:1px solid var(--color-divider);border-right:1px solid var(--color-divider)\"><img src=\"{{ aImg }}\" alt=\"{{ aAlt }}\" style=\"width:100%;height:100%;object-fit:cover;display:block\"><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"border-bottom:1px solid var(--color-divider)\">\n    <div style=\"max-width:1600px;margin:0 auto;padding:clamp(30px,4vw,72px) clamp(12px,2vw,28px);display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:clamp(28px,4vw,72px);align-items:start\">\n      <div style=\"display:flex;flex-direction:column;gap:20px;max-width:66ch\">\n        <p style=\"font-size:clamp(17px,1.5vw,21px);line-height:1.55;font-weight:600;color:var(--color-text);margin:0\">{{ aLead }}<\u002Fp>\n        <sc-for list=\"{{ aBody }}\" as=\"para\" hint-placeholder-count=\"3\">\n          <p style=\"font-size:16px;line-height:1.72;color:var(--color-neutral-700);margin:0\">{{ para.text }}<\u002Fp>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <aside style=\"border-top:2px solid var(--color-text);padding-top:22px;display:flex;flex-direction:column;gap:0;position:sticky;top:86px\">\n        <div style=\"font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;margin-bottom:18px\">The numbers<\u002Fdiv>\n        <sc-for list=\"{{ aFacts }}\" as=\"fact\" hint-placeholder-count=\"3\">\n          <div style=\"display:flex;justify-content:space-between;gap:16px;padding:13px 0;border-bottom:1px solid var(--color-divider)\">\n            <span style=\"font-size:13px;color:var(--color-neutral-700);max-width:20ch\">{{ fact.k }}<\u002Fspan>\n            <span style=\"font-size:14px;font-weight:800;letter-spacing:-.01em;text-align:right\">{{ fact.v }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n        <p style=\"font-size:11px;line-height:1.6;color:var(--color-neutral-600);margin:16px 0 0\">Figures marked with a dot are indicative and awaiting client confirmation before publication.<\u002Fp>\n      <\u002Faside>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"border-bottom:1px solid var(--color-divider)\">\n    <div style=\"max-width:1600px;margin:0 auto;padding:clamp(28px,4vw,64px) clamp(12px,2vw,28px)\">\n      <div style=\"font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--color-neutral-600);margin-bottom:22px\">Read next<\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:1px;background:var(--color-divider);border:1px solid var(--color-divider)\">\n        <sc-for list=\"{{ aNext }}\" as=\"item\" hint-placeholder-count=\"3\">\n          <a href=\"{{ item.href }}\" sc-camel-on-click=\"{{ item.open }}\" style=\"background:var(--color-bg);padding:clamp(18px,2vw,28px);display:flex;flex-direction:column;gap:10px;color:var(--color-text)\" style-hover=\"background: var(--color-accent-100)\">\n            <span style=\"font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--color-accent)\">{{ item.cat }}<\u002Fspan>\n            <span style=\"font-size:19px;line-height:1.15;font-weight:800;letter-spacing:-.02em\">{{ item.title }}<\u002Fspan>\n            <span style=\"font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--color-neutral-600);margin-top:6px\">{{ item.read }}<\u002Fspan>\n          <\u002Fa>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n<\u002Farticle>\n\n<\u002Fdiv>\n\n<section style=\"background:var(--color-accent);color:#fff\">\n  <div style=\"max-width:1600px;margin:0 auto;padding:clamp(40px,6vw,100px) clamp(12px,2vw,28px);display:flex;justify-content:space-between;align-items:flex-end;gap:28px;flex-wrap:wrap\">\n    <h2 style=\"font-size:clamp(26px,4.2vw,64px);line-height:1;font-weight:900;letter-spacing:-.04em;margin:0;max-width:17ch\">Come and check the claims yourself.<\u002Fh2>\n    <a href=\"Texgen-Contact.dc.html\" class=\"btn\" style=\"background:#fff;color:var(--color-accent)\">Book an audit visit<\u002Fa>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<footer style=\"background:var(--color-text);color:var(--color-bg)\">\n  <div style=\"max-width:1600px;margin:0 auto;padding:clamp(36px,5vw,72px) clamp(12px,2vw,28px) clamp(22px,3vw,36px);display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:clamp(22px,3vw,44px)\">\n    <div><img src=\"3836d5e8-12d9-4d45-b0e7-0626caff1250\" alt=\"Texgen Group\" style=\"height:34px;filter:brightness(0) invert(1);margin-bottom:16px\"><p style=\"font-size:14px;line-height:1.55;opacity:.6;margin:0;max-width:32ch\">From fabric to finished goods — every stitch reflects our promise to deliver better.<\u002Fp><\u002Fdiv>\n    <div><div style=\"font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;opacity:.45;margin-bottom:14px\">Company<\u002Fdiv><div style=\"display:grid;gap:9px;font-size:14px\"><a href=\"Texgen-About.dc.html\" style=\"color:var(--color-bg);opacity:.8\">About<\u002Fa><a href=\"Texgen-About.dc.html#leadership\" style=\"color:var(--color-bg);opacity:.8\">Leadership<\u002Fa><a href=\"Texgen-Gallery.dc.html\" style=\"color:var(--color-bg);opacity:.8\">Gallery<\u002Fa><a href=\"Texgen-Careers.dc.html\" style=\"color:var(--color-bg);opacity:.8\">Careers<\u002Fa><\u002Fdiv><\u002Fdiv>\n    <div><div style=\"font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;opacity:.45;margin-bottom:14px\">Capabilities<\u002Fdiv><div style=\"display:grid;gap:9px;font-size:14px\"><a href=\"Texgen-Knitting.dc.html\" style=\"color:var(--color-bg);opacity:.8\">Knitting<\u002Fa><a href=\"Texgen-Capabilities.dc.html\" style=\"color:var(--color-bg);opacity:.8\">All departments<\u002Fa><a href=\"Texgen-Products.dc.html\" style=\"color:var(--color-bg);opacity:.8\">Products<\u002Fa><a href=\"Texgen-Sustainability.dc.html\" style=\"color:var(--color-bg);opacity:.8\">Sustainability<\u002Fa><\u002Fdiv><\u002Fdiv>\n    <div><div style=\"font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;opacity:.45;margin-bottom:14px\">Contact<\u002Fdiv><div style=\"display:grid;gap:9px;font-size:14px;opacity:.8\"><a href=\"mailto:info@texgengroup.com\" style=\"color:var(--color-bg)\">info@texgengroup.com<\u002Fa><span>+88 02-223371436-38<\u002Fspan><a href=\"https://www.facebook.com/TexgenGroup\" style=\"color:var(--color-bg)\">Facebook<\u002Fa><\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"border-top:1px solid rgba(243,242,242,.16)\"><div style=\"max-width:1600px;margin:0 auto;padding:16px clamp(12px,2vw,28px);display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font-size:12px;opacity:.5\"><span>© 2026 Texgen Group. Radiance Knitwears Limited.<\u002Fspan><span>Banani, Dhaka · Ashulia, Savar<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<\u002Ffooter>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:900}}\">\nconst S = \"uploads/texgen-images-optimized/07-sustainability/\";\nconst G = \"uploads/texgen-images-optimized/09-gallery/\";\nconst C = \"uploads/texgen-images-optimized/08-career/\";\n\nconst POSTS = [\n  {\n    id: \"solar\",\n    cat: \"Environment\",\n    date: \"14 May 2026\",\n    read: \"4 min read\",\n    title: \"The roof at Ashulia is now doing a day's work\",\n    excerpt: \"What the solar array covers, what it does not, and where the next one goes.\",\n    img: (window.__resources && window.__resources.csrSolar) || \"uploads/texgen-images-optimized/07-sustainability/Sustainability2.jpg\",\n    alt: \"Rooftop solar array at the Ashulia facility\",\n    lead: \"Our solar project is a key step toward an energy-efficient workplace. By harnessing solar power we meet a significant portion of our daily energy needs through renewable sources — reducing operational costs and supporting our long-term goal of carbon-neutral manufacturing.\",\n    body: [\n      \"The array feeds the knitting floor first, because that is where load is steadiest through the working day. Grid draw drops most sharply between 10am and 3pm, which is also when the knitting machines run hardest — so the generation curve and the demand curve line up better than they would on the sewing floors.\",\n      \"Solar alone does not decarbonise a composite mill. It reduces purchased electricity; it does not touch the thermal load in finishing. We are treating this as the first of three steps, with the next two being heat recovery in finishing and a reduction in compressed-air leakage across both garment units.\",\n      \"The commercial case is simple enough that we are happy to publish it. If you are auditing us on Higg FEM, the generation data is metered separately and can be exported for any period you ask for.\"\n    ],\n    facts: [\n      { k: \"Installed capacity\", v: \"· 420 kWp\" },\n      { k: \"Share of daytime load\", v: \"· 18%\" },\n      { k: \"Commissioned\", v: \"· 2025\" },\n      { k: \"Metering\", v: \"Separate, exportable\" }\n    ]\n  },\n  {\n    id: \"recycled-fashion\",\n    cat: \"Environment\",\n    date: \"2 Apr 2026\",\n    read: \"3 min read\",\n    title: \"Recycled fashion, and what it costs to do it properly\",\n    excerpt: \"High-quality recycled fabrics, yarns and trims — and the QC overhead that comes with them.\",\n    img: (window.__resources && window.__resources.csrRecycled) || \"uploads/texgen-images-optimized/07-sustainability/Sustainability11.jpg\",\n    alt: \"Recycled knit fabric rolls in the fabric store\",\n    lead: \"By choosing high-quality recycled fabrics, yarns and trims, we give materials a second life — creating garments that unite style with sustainability. Each piece reflects our commitment to eco-friendly manufacturing.\",\n    body: [\n      \"Recycled content behaves differently on the machine. Staple length is shorter and more variable, which shows up as yarn breakage in knitting and as shade variation between lots. Neither is a reason to avoid it; both are reasons to plan for it.\",\n      \"We handle it by tightening incoming yarn inspection, running smaller dye lots, and holding a wider shade band tolerance agreed with the buyer up front rather than argued about at final inspection. Where a programme is GRS-certified, transaction certificates follow the goods.\",\n      \"The honest summary: recycled programmes take more sampling and more lab time than virgin equivalents. We would rather quote that time into the lead time than discover it in week three of bulk.\"\n    ],\n    facts: [\n      { k: \"Standard\", v: \"GRS\" },\n      { k: \"Recycled programmes run\", v: \"· 11 in 2025\" },\n      { k: \"Typical added lead time\", v: \"· 5-7 days\" },\n      { k: \"Transaction certificates\", v: \"Per shipment\" }\n    ]\n  },\n  {\n    id: \"yarn\",\n    cat: \"Environment\",\n    date: \"18 Feb 2026\",\n    read: \"3 min read\",\n    title: \"Where our recycled yarn actually comes from\",\n    excerpt: \"Approved mills, traceability documents, and why we do not buy on the open market.\",\n    img: (window.__resources && window.__resources.csrYarn) || \"uploads/texgen-images-optimized/07-sustainability/Sustainability3.jpg\",\n    alt: \"Yarn cones staged for the knitting floor\",\n    lead: \"Textile waste recycling plays a vital role in reducing environmental impact across the RMG industry — cutting waste generation, conserving resources and lowering carbon footprint.\",\n    body: [\n      \"We source recycled yarn from approved mills and use it in production to manufacture fabrics and garments with reduced environmental impact. Approval is not a formality: a mill enters the list after a documentation review and stays on it only while its certification is current.\",\n      \"The reason we do not buy recycled yarn on the spot market is traceability. A GRS claim is only as strong as the chain of transaction certificates behind it, and a cheap cone with no paperwork is a liability on an audit, not a saving.\",\n      \"Post-industrial waste from our own cutting floor is segregated by composition and colour before it leaves the site, which raises what it is worth to a recycler and keeps mixed-fibre waste out of the stream.\"\n    ],\n    facts: [\n      { k: \"Approved mills\", v: \"· 4\" },\n      { k: \"Cutting waste segregated\", v: \"By composition\" },\n      { k: \"Standards\", v: \"GRS · OCS\" },\n      { k: \"Spot-market purchases\", v: \"None\" }\n    ]\n  },\n  {\n    id: \"community\",\n    cat: \"Community\",\n    date: \"21 Jan 2026\",\n    read: \"3 min read\",\n    title: \"Schools, scholarships and the annual picnic\",\n    excerpt: \"Education support, special-needs schools, and the welfare work our teams choose themselves.\",\n    img: (window.__resources && window.__resources.csrCommunity) || \"uploads/texgen-images-optimized/09-gallery/emp3.jpg\",\n    alt: \"Employees at the Radiance Knitwears annual gathering\",\n    lead: \"We extend care beyond our workplace by supporting education for underprivileged students, assisting autism and special-needs schools, and contributing to social welfare activities.\",\n    body: [\n      \"We aim to build a community where opportunity, care and kindness grow together. In practice that means a small number of commitments held for a long time rather than a large number held for one reporting cycle.\",\n      \"The education support runs through local schools near the Ashulia facility and is aimed at students whose families work in the industry. The special-needs school partnership was proposed by our own staff, and it is the one we are asked about most often by workers rather than by buyers.\",\n      \"The annual gathering is not CSR in a technical sense, but it is the single thing most cited in our internal engagement surveys, so it stays in the budget.\"\n    ],\n    facts: [\n      { k: \"Schools supported\", v: \"· 3\" },\n      { k: \"Students assisted (2025)\", v: \"· 140\" },\n      { k: \"Special-needs partnership\", v: \"Since 2022\" },\n      { k: \"Staff welfare fund\", v: \"Payroll-linked\" }\n    ]\n  },\n  {\n    id: \"equal-opportunity\",\n    cat: \"People\",\n    date: \"9 Dec 2025\",\n    read: \"3 min read\",\n    title: \"Equal opportunity, in policy and on the line\",\n    excerpt: \"Fair access to advancement, skills development and decision-making roles.\",\n    img: (window.__resources && window.__resources.csrEqual) || \"uploads/texgen-images-optimized/09-gallery/emp1.jpg\",\n    alt: \"Production team on the sewing floor\",\n    lead: \"Our focus on equal opportunity ensures that all individuals have fair access to career advancement, skills development and decision-making roles.\",\n    body: [\n      \"Through ongoing awareness programmes and supportive policies, we are building a workplace where everyone can reach their full potential with dignity and respect. The measure we hold ourselves to is not the policy document — every factory has one — but the share of supervisory roles filled from within, and by whom.\",\n      \"Anti-harassment committees, grievance channels and the workplace code of conduct are audited under amfori BSCI and SEDEX. Findings and corrective action plans from those audits are available to buyers on request.\",\n      \"We publish the numbers we have and mark the ones we are still building a baseline for. Overstating this particular metric is not worth the audit exposure.\"\n    ],\n    facts: [\n      { k: \"Workforce\", v: \"2,300\" },\n      { k: \"Supervisory roles filled internally\", v: \"· 64%\" },\n      { k: \"Grievance channels\", v: \"3, incl. anonymous\" },\n      { k: \"Audited under\", v: \"BSCI · SEDEX\" }\n    ]\n  },\n  {\n    id: \"learning\",\n    cat: \"People\",\n    date: \"17 Nov 2025\",\n    read: \"4 min read\",\n    title: \"Learning and development is a production decision\",\n    excerpt: \"Technical skills, leadership, and why training budget survives a slow quarter.\",\n    img: (window.__resources && window.__resources.csrLearning) || \"uploads/texgen-images-optimized/08-career/learning.jpg\",\n    alt: \"Learning and development session for production staff\",\n    lead: \"Continuous learning is essential to both employee growth and organisational success. Our development programmes build technical expertise, leadership qualities and positive work practices, aligning individual career growth with business needs.\",\n    body: [\n      \"The technical track is the one with the clearest return: an operator moved from single-needle to flatlock is worth more to the line and earns more. The leadership track is slower and harder to measure, and it is the one that determines whether a good operator becomes a good supervisor or simply leaves.\",\n      \"Training runs against the same Kaizen framework as the rest of the floor. Teams identify a problem, analyse root causes, and implement corrective and preventive action — the training need falls out of that analysis rather than being scheduled in the abstract.\",\n      \"We protect the budget in slow quarters because a slow quarter is when there is floor time to do it.\"\n    ],\n    facts: [\n      { k: \"Programmes\", v: \"Technical · Leadership\" },\n      { k: \"Framework\", v: \"Kaizen · TQMS\" },\n      { k: \"Trained in 2025\", v: \"· 610 staff\" },\n      { k: \"Average hours per head\", v: \"· 12/year\" }\n    ]\n  },\n  {\n    id: \"quality\",\n    cat: \"People\",\n    date: \"3 Oct 2025\",\n    read: \"3 min read\",\n    title: \"What Kaizen looks like when it is not a poster\",\n    excerpt: \"QA integrated at every stage, and the corrective-action loop behind it.\",\n    img: (window.__resources && window.__resources.csrQuality) || \"uploads/texgen-images-optimized/08-career/progrm1.jpg\",\n    alt: \"Quality assurance briefing with production staff\",\n    lead: \"We operate with a strong commitment to Quality Assurance and continuous improvement, guided by Kaizen principles. QA is integrated at every stage of production to ensure consistent quality, compliance with buyer requirements, and adherence to international standards.\",\n    body: [\n      \"We practise Total Quality Management, where teams collaborate to identify problems, analyse root causes, and implement corrective and preventive action — driving measurable gains in productivity, quality, cost and workplace safety.\",\n      \"The part that makes it real is the loop closing in public. A defect found at final inspection is traced back to the operation that caused it, and the fix is briefed on that line, not filed. Where the root cause is a machine setting or a trim supplier rather than an operator, we say so — otherwise the loop teaches people to hide defects.\",\n      \"Our in-house lab supports this with colour fastness, shrinkage, strength and durability testing under controlled conditions, so a quality argument with a buyer starts from data rather than opinion.\"\n    ],\n    facts: [\n      { k: \"QA stages\", v: \"Inline · End-line · Final\" },\n      { k: \"In-house lab tests\", v: \"4 families\" },\n      { k: \"Standard\", v: \"ISO 9001\" },\n      { k: \"CAPA loop\", v: \"Briefed on line\" }\n    ]\n  },\n  {\n    id: \"governance\",\n    cat: \"Governance\",\n    date: \"12 Sep 2025\",\n    read: \"2 min read\",\n    title: \"Governance is what makes the rest of this checkable\",\n    excerpt: \"Transparency, accountability and ethical decision-making at every level.\",\n    img: (window.__resources && window.__resources.csrGovernance) || \"uploads/texgen-images-optimized/07-sustainability/Corporate-Governance.jpg\",\n    alt: \"Governance and management policy review\",\n    lead: \"Strong governance is the foundation of sustainable growth. Our management practices emphasise transparency, accountability and ethical decision-making at every level.\",\n    body: [\n      \"Through clear policies, compliance and responsible leadership, we hold our operations to high standards of integrity. The practical test of governance in a factory is whether a worker, a supervisor and a buyer looking at the same issue would all be told the same thing.\",\n      \"We have adopted the SA8000 social accountability standard as the workplace code of conduct across our production network, and we hold our suppliers to international social and environmental standards as well as our own facilities.\",\n      \"Nothing on this page is intended to be taken on trust. Every claim here has a document, a meter reading or an audit report behind it, and we would rather you asked for it.\"\n    ],\n    facts: [\n      { k: \"Code of conduct\", v: \"SA8000 · to confirm\" },\n      { k: \"Supplier standards\", v: \"Cascaded\" },\n      { k: \"Audit frameworks\", v: \"BSCI · SEDEX · WRAP\" },\n      { k: \"Reports on request\", v: \"Yes\" }\n    ]\n  }\n];\n\nclass Component extends DCLogic {\n  state = { filter: \"all\", open: null };\n\n  pick(id) {\n    return (e) => {\n      if (e && e.preventDefault) e.preventDefault();\n      this.setState({ open: id });\n      const sc = document.scrollingElement || document.documentElement;\n      if (sc) sc.scrollTop = 0;\n    };\n  }\n\n  tab(key) {\n    const on = this.state.filter === key;\n    return \"appearance:none;cursor:pointer;font-family:inherit;border:0;border-right:1px solid var(--color-divider);padding:15px clamp(14px,1.8vw,26px);font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;display:flex;align-items:center;gap:8px;\"\n      + (on ? \"background:var(--color-accent);color:#fff;\" : \"background:transparent;color:var(--color-text);\");\n  }\n\n  count(cat) { return POSTS.filter((p) => p.cat === cat).length; }\n\n  card(p) {\n    return {\n      id: p.id, cat: p.cat, date: p.date, read: p.read, title: p.title,\n      excerpt: p.excerpt, img: p.img, alt: p.alt,\n      href: \"#\" + p.id, open: this.pick(p.id)\n    };\n  }\n\n  renderVals() {\n    const f = this.state.filter;\n    const openId = this.state.open;\n    const art = openId ? POSTS.find((p) => p.id === openId) : null;\n    const list = f === \"all\" ? POSTS : POSTS.filter((p) => p.cat === f);\n\n    const vals = {\n      listStyle: art ? \"display:none\" : \"display:block\",\n      articleStyle: art ? \"display:block\" : \"display:none\",\n      posts: list.map((p) => this.card(p)),\n      featuredHref: \"#solar\",\n      openFeatured: this.pick(\"solar\"),\n      back: () => this.setState({ open: null }),\n      nAll: POSTS.length,\n      nEnv: this.count(\"Environment\"),\n      nPeople: this.count(\"People\"),\n      nCommunity: this.count(\"Community\"),\n      nGov: this.count(\"Governance\"),\n      tAll: this.tab(\"all\"), tEnv: this.tab(\"Environment\"), tPeople: this.tab(\"People\"),\n      tCommunity: this.tab(\"Community\"), tGov: this.tab(\"Governance\"),\n      fAll: () => this.setState({ filter: \"all\" }),\n      fEnv: () => this.setState({ filter: \"Environment\" }),\n      fPeople: () => this.setState({ filter: \"People\" }),\n      fCommunity: () => this.setState({ filter: \"Community\" }),\n      fGov: () => this.setState({ filter: \"Governance\" })\n    };\n\n    const blank = { cat: \"\", date: \"\", read: \"\", title: \"\", img: POSTS[0].img, alt: \"\", lead: \"\" };\n    if (true) {\n      const a = art || blank;\n      vals.aCat = a.cat;\n      vals.aDate = a.date;\n      vals.aRead = a.read;\n      vals.aTitle = a.title;\n      vals.aImg = a.img;\n      vals.aAlt = a.alt;\n      vals.aLead = a.lead;\n      vals.aBody = (a.body || []).map((t) => ({ text: t }));\n      vals.aFacts = a.facts || [];\n      vals.aNext = POSTS.filter((p) => p.id !== a.id).slice(0, 3).map((p) => this.card(p));\n    }\n    return vals;\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
